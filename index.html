<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Berthama Records</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- TOP BLOCK (header + nav share ONE background) -->  
    <div class="top-shell">

        <header>
            <h1 onclick="showLanding()">BERTHAMA</h1>
            <p class="slogan">TURBULENT | UNGOVERNABLE | REFRACTORY</p>
        </header>

        <nav>
            <ul>
                <li><a href="javascript:void(0)" onclick="showPage('about')">About</a></li>
                <li><a href="javascript:void(0)" onclick="showPage('releases')">Releases</a></li>
                <li><a href="javascript:void(0)" onclick="showPage('contact')">Contact</a></li>
            </ul>
        </nav>

    </div>

    <main>
        <section id="landing" class="active"></section>

        <div id="normal-pages">
            <section id="about">
                <h2>About Berthama</h2>
                <p>We are a techno record label based in Prishtina.</p>
            </section>

            <section id="releases">
                <article>
                    <h3>Artist: NCRYPTED</h3>
                    <p>Title: WHAT?</p>
                </article>
            </section>

            <section id="contact">
                <h2>Contact</h2>
                <p>Email: berthamarecording@gmail.com</p>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Berthama Records | All Rights Reserved</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
